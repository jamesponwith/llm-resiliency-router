# Failure profiles for the chaos provider (cmd/chaos) and component tests.
healthy: {}
flaky:
  fail_every: 3 # every 3rd request 500s
slow:
  latency: 2s
down:
  fail_every: 1 # every request 500s
hang:
  hang: true # accepts the request, never responds (exercises health.timeout)
lobotomized: # answers 200 OK with garbage — only the canary catches this
  reply: as an AI language model I cannot help with that
brilliant: # passes every stock canary check: contains 42 and tac, valid JSON
  reply: '{"answer": "42", "cat_backwards": "tac"}'
