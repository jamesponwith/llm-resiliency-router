# Learn: weekly DORA-lite snapshot committed back to the repo. The git
# history of docs/dora.json is the trend line; docs/dora.html renders the
# latest snapshot. Insight → new bd issues → Intent. The flywheel turns.
name: learn

on:
  schedule:
    - cron: "0 6 * * 1" # monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/dora -repo "$GITHUB_REPOSITORY" -out docs/dora.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/dora.json
          if ! git diff --cached --quiet; then
            git commit -m "learn: weekly DORA snapshot"
            git push
          fi
