# Operate: probe the deployed instance and turn sustained SLO breaches into
# `incident`-labelled issues, which learn.yml already reads for change-failure
# rate and MTTR (ADR 0002). Incidents close themselves when the target recovers.
#
# Set docs/slo.yml's url to a real deployment before enabling — until then this
# is a no-op that reports "unreachable" against example.invalid.
name: operate

# DISABLED ON A SCHEDULE (2026-08-17). This probed an address it could never
# reach — example.invalid, or a loopback port from a GitHub-hosted runner — and
# filed an `incident` issue for it roughly every 50 minutes. Those incidents
# never close, because recovery only queries the current URL and the target was
# never up, so tools/dora counted them as real change failures: the router's
# published dora.json read a 200% change-failure rate with zero MTTR samples.
#
# The Operate stage exists to make CFR and MTTR honest. Pointed at nothing, it
# does the exact opposite, and this repo's own ADR 0003 says to leave the
# workflow disabled until `url` names a real deployment. It was enabled anyway.
#
# Re-enable by restoring the schedule AFTER docs/slo.yml points at something
# reachable from a hosted runner.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: operate # never two probers racing to file the same incident
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # One canonical prober, invoked cross-repo (ADR 0005). Instances do not
      # carry a copy of tools/watch, so the local-path form only works inside
      # the template itself.
      - run: go run github.com/jamesponwith/flywheel-template/tools/watch@latest -repo "$GITHUB_REPOSITORY" -slo docs/slo.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
