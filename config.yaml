# M2: priority failover — upstreams are tried in order; one that fails
# health.eject_after times in a row is ejected, then probed with real traffic
# every probe_interval until it recovers. url is the provider ORIGIN only
# (no /v1 suffix) — the client's path is forwarded verbatim.
mode: learn # learn = observe + log decisions only; flip to action once decisions.jsonl looks right
listen: :8484
decision_log: decisions.jsonl # every routing decision with its inputs, one JSON per line
hedge_after: 0 # e.g. 1500ms: no first token by then → race the next upstream, first token wins. Costs duplicate requests — off by default
upstreams:
  - name: local
    kind: ollama # openai-compatible; url defaults to http://localhost:11434
  # - name: anthropic
  #   kind: anthropic # translated to /v1/messages under the hood
  #   api_key_env: ANTHROPIC_API_KEY
  #   models: { "gpt-4o": "claude-sonnet-5" } # requested-model → provider-model
  # - name: openai
  #   kind: openai
  #   api_key_env: OPENAI_API_KEY
# canary: # background quality probes — a provider serving 200s of garbage gets ejected
#   interval: 5m
#   model: llama3.2 # requested-model name; per-upstream models mapping applies
#   prompts: canary/prompts.yaml
health:
  eject_after: 3 # consecutive hard failures (5xx/429/timeout/canary miss) before ejection
  window: 60s # p95 window for the degraded signal
  degrade_p95: 8s # p95 above this marks the cell degraded (log-only until M3)
  probe_interval: 15s # half-open probe cadence while ejected
  timeout: 30s # upstream response-header timeout (catches hangs)
